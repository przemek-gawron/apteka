name: Testy E2E

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalacja zależności
        run: pip install -r requirements-dev.txt

      - name: Instalacja przeglądarki
        run: python -m playwright install --with-deps chromium

      # conftest.py sam uruchamia aplikację (APP_ENV=test) przed testami
      - name: Testy
        run: python -m pytest -v

      - name: Zapisz trace i screenshoty z nieudanych testów
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
